name: Windows Native Build (NVIDIA + DirectX 11 + Multi-core)

on:
  push:
    branches: [ main, windows-native-v3, "**" ]
    paths:
      - 'kf3.cpp'
      - 'kursor.conf'
      - 'run.bat'
      - 'kill.bat'
      - 'startup_ON.bat'
      - 'startup_OFF.bat'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build KursorFlame.exe (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up MSVC Developer Command Prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # Let the action pick the latest installed Windows SDK + MSVC toolset.
          # Pinning specific versions breaks when GitHub rotates the windows-latest image.

      - name: Show toolchain versions
        shell: cmd
        run: |
          echo === cl.exe version ===
          cl 2>&1 | findstr /R "Microsoft"
          echo === Windows SDK include path ===
          echo %INCLUDE%
          echo === Windows SDK lib path ===
          echo %LIB%

      - name: Compile KursorFlame.exe (Release x64, MSVC)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          cl /nologo /O2 /EHsc /std:c++17 /utf-8 ^
             /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE ^
             /Fe:KursorFlame.exe ^
             kf3.cpp ^
             /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /NOLOGO ^
             d3d11.lib dxgi.lib dxguid.lib d3dcompiler.lib ^
             user32.lib gdi32.lib dwmapi.lib dcomp.lib ^
             ole32.lib shell32.lib shlwapi.lib
          if errorlevel 1 exit /b 1
          dir KursorFlame.exe

      - name: Generate default kursor.conf (will be auto-created on first run anyway)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist kursor.conf (
            echo # KursorFlame default config placeholder > kursor.conf
            echo # A full config will be generated on first run. >> kursor.conf
          )

      - name: Stage release files
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          mkdir staging
          copy /Y KursorFlame.exe staging\
          copy /Y run.bat staging\
          copy /Y kill.bat staging\
          copy /Y startup_ON.bat staging\
          copy /Y startup_OFF.bat staging\
          if exist kursor.conf copy /Y kursor.conf staging\
          if exist README.md copy /Y README.md staging\
          dir staging

      - name: Zip staging folder into KursorFlame_windows_v3.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\staging\*" `
                            -DestinationPath "$env:GITHUB_WORKSPACE\KursorFlame_windows_v3.zip" `
                            -CompressionLevel Optimal
          Get-ChildItem "$env:GITHUB_WORKSPACE\KursorFlame_windows_v3.zip" | Select-Object Name,Length

      - name: Compute SHA-256 of the executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE\KursorFlame.exe" -Algorithm SHA256).Hash
          $size = (Get-Item "$env:GITHUB_WORKSPACE\KursorFlame.exe").Length
          "KursorFlame.exe SHA256: $hash" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\sha256.txt"
          "KursorFlame.exe size  : $size bytes" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\sha256.txt" -Append
          Get-Content "$env:GITHUB_WORKSPACE\sha256.txt"

      - name: Upload KursorFlame.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: KursorFlame_exe
          path: KursorFlame.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload KursorFlame_windows_v3.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: KursorFlame_windows_v3_zip
          path: |
            KursorFlame_windows_v3.zip
            sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Workflow summary
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host " KursorFlame v3.0 - Windows Native Build OK"
          Write-Host "=============================================="
          Write-Host "Architectural highlights:"
          Write-Host "  - NVIDIA GPU: D3D11 device created on adapter with VendorId 0x10DE (NVIDIA)"
          Write-Host "    Falls back to default DXGI adapter if NVIDIA is absent"
          Write-Host "  - DirectX 11: Direct3D 11 + DXGI 1.4 + DirectComposition"
          Write-Host "    Per-pixel alpha overlay via CreateSwapChainForComposition + DCompositionCreateDevice"
          Write-Host "  - CPU cores: thread pool uses std::thread::hardware_concurrency() workers"
          Write-Host "    Particle sim + rasterization split across all cores (replaces 2-core std::async)"
          Write-Host "  - Native: Win32 + Raw Input + RegisterHotKey, no Linux/X11 code"
          Write-Host "=============================================="
